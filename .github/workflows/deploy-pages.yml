name: Deploy workshop to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Rebuild binary assets and verify checksums
        run: |
          set -euo pipefail
          rm -rf _out && cp -r site _out
          cd _out
          # Fonts and PDFs are stored base64-encoded (the push tool is text-only); restore them byte-for-byte.
          find . -type f -name '*.b64' -print0 | while IFS= read -r -d '' f; do
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done
          mv SHA256SUMS ../SHA256SUMS
          sha256sum -c ../SHA256SUMS
          echo "Files in published site: $(find . -type f | wc -l)"
          touch .nojekyll

      - name: Publish to gh-pages branch
        run: |
          set -euo pipefail
          cd _out
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
